# 行业信息助手 - Nginx 生产环境配置
# 文件路径: /etc/nginx/sites-available/industry

server {
    listen 80;
    # 替换为你的域名，如果只有IP则删掉下面这行
    # server_name your-domain.com;

    # 日志
    access_log /var/log/nginx/industry_access.log;
    error_log /var/log/nginx/industry_error.log;

    # 前端静态文件
    location / {
        root /opt/industry_assistant/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;

        # 静态资源缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # 后端 API 反向代理
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 长连接支持（聊天流式输出）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;

        # 上传文件大小限制
        client_max_body_size 100m;
    }

    # 健康检查端点
    location /hello {
        proxy_pass http://127.0.0.1:8000/hello;
        proxy_set_header Host $host;
    }
}
