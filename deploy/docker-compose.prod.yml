# 百度云 BCC 生产环境 docker-compose（安全加固版）
# 与原版区别: 不对外暴露中间件端口，仅本地访问

version: '3.8'

services:
  # ==================== PostgreSQL ====================
  postgres:
    image: postgres:15-alpine
    container_name: industry_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: industry_assistant
      TZ: Asia/Shanghai
    # 仅绑定 localhost，不对外暴露
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - /data/postgres:/var/lib/postgresql/data
      - ./docker/init-db:/docker-entrypoint-initdb.d
    networks:
      - industry_network

  # ==================== Redis ====================
  redis:
    image: redis:7-alpine
    container_name: industry_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ""
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - /data/redis:/data
    networks:
      - industry_network

  # ==================== Milvus 依赖 ====================
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: industry_etcd
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - /data/etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    networks:
      - industry_network

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: industry_minio
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - /data/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    networks:
      - industry_network

  milvus:
    image: milvusdb/milvus:v2.3.3
    container_name: industry_milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - /data/milvus:/var/lib/milvus
    ports:
      - "127.0.0.1:19530:19530"
    depends_on:
      - etcd
      - minio
    networks:
      - industry_network

volumes: {}

networks:
  industry_network:
    driver: bridge
